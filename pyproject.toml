[build-system]
# The package is pure Python (every kernel is Triton / Gluon, compiled at run time): no build-time dependency on torch.
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuronspark"
version = "1.0.0"
description = "NeuronSpark: a spiking language model of dendritic neuron and hippocampal layers, with Triton and Gluon operators"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["spiking neural network", "language model", "state space model", "triton", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA",
]
dependencies = [
    "torch==2.9.1",
    "triton==3.5.1",
    "safetensors>=0.4",
    "packaging",
]

[project.urls]
Repository = "https://github.com/Brain2nd/NeuronSpark"
